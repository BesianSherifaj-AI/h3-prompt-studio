name: Validate Studio and Game

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock.txt
          npm ci --prefix frontend
      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm test
          npm run build
      - name: Install CPU media and browser tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          cd frontend
          npx playwright install --with-deps chromium
      - name: Test backend contracts and recovery
        run: python -m pytest -q
      - name: Test ComfyUI browser bridge
        run: node --test comfy_extension/tests/*.test.mjs
      - name: Smoke test built Game and Studio UI with isolated data
        run: |
          node tools/browser_game_smoke.mjs
          node tools/browser_scene_continuity_smoke.mjs
      - name: Verify distributable packaging
        run: python tools/package_release.py --version 1.4.0 --output-dir release/ci
